
enable
configure terminal
hostname RTR-BANGANTE
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 ip address 10.200.121.2 255.255.255.252
 no shutdown
 exit

interface e0/2
 ip address 10.121.121.2 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 200.121.121.2 255.255.255.255
 no shutdown
 exit

router bgp 121
 neighbor 10.121.121.1 remote-as 121
 neighbor 10.200.121.1 remote-as 200
 
 network 200.121.121.2 mask 255.255.255.255
 exit



end
write memory
