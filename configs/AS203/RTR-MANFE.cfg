
enable
configure terminal
hostname RTR-MANFE
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 ip address 10.203.202.1 255.255.255.252
 no shutdown
 exit

interface e0/1
 ip address 10.203.200.2 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 203.203.0.0 255.255.255.255
 no shutdown
 exit

router bgp 203
 neighbor 10.203.200.1 remote-as 200
 neighbor 10.203.200.1 transport connection-mode passive
 
 neighbor 10.203.202.2 remote-as 202

 network 203.203.0.0 mask 255.255.255.255
 
end
write memory
