
enable
configure terminal
hostname RTR-BAFIA
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 description RTR-BAFIA_INTERCO_RTR-BOKITO
 ip address 172.17.17.10 255.255.255.252
 no shutdown
 exit

interface e0/1
 description RTR-BAFIA_INTERCO_RTR-TONGA_AS202
 ip address 10.202.224.1 255.255.255.252
 no shutdown
 exit

interface e0/2
 description RTR-BAFIA_INTERCO_RTR-KIIKI
 ip address 172.17.17.1 255.255.255.252
 no shutdown
 exit

interface e0/3
 description RTR-BAFIA_INTERCO_RTR-MAKENENE_AS201
 ip address 10.201.224.5 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 80.80.0.0 255.255.255.255
 no shutdown
 exit

router bgp 224
    neighbor 172.17.17.2 remote-as 224
    neighbor 10.202.224.2 remote-as 202
    neighbor 10.202.224.6 remote-as 201
    neighbor 172.17.17.9 remote-as 224
    network 80.80.0.0 mask 255.255.255.255
    exit

router ospf 1
    network 172.17.17.0 0.0.0.3 area 0
    network 172.17.17.8 0.0.0.3 area 0

    default-information originate always
end
write memory
