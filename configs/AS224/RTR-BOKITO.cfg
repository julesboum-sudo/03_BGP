
enable
configure terminal
hostname RTR-BOKITO
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 description RTR-BOKITO_INTERCO_RTR-KINO
 ip address 172.17.17.14 255.255.255.252
 no shutdown
 exit

interface e0/1
 description RTR-BOKITO_INTERCO_RTR-OMBESSA
 ip address 172.17.17.18 255.255.255.252
 no shutdown
 exit

interface e0/2
 description RTR-BOKITO_INTERCO_RTR-NKOMETOU
 ip address 172.17.17.25 255.255.255.252
 no shutdown
 exit

interface e0/3
 description RTR-BOKITO_INTERCO_RTR-OBALA
 ip address 172.17.17.29 255.255.255.252
 no shutdown
 exit

interface e1/0
 description RTR-BOKITO_INTERCO_RTR-BAFIA
 ip address 172.17.17.9 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 100.200.20.2 255.255.255.255
 no shutdown
 exit

router bgp 224
 neighbor 172.17.17.30 remote-as 224
 neighbor 172.17.17.26 remote-as 224
 neighbor 172.17.17.17 remote-as 224
 neighbor 172.17.17.10 remote-as 224
 neighbor 172.17.17.13 remote-as 224

 network 100.200.20.2 mask 255.255.255.255
  exit

router ospf 1
    network 172.17.17.12 0.0.0.3 area 0
    network 172.17.17.8 0.0.0.3 area 0
    network 172.17.17.16 0.0.0.3 area 0
    network 172.17.17.24 0.0.0.3 area 0
    network 172.17.17.28 0.0.0.3 area 0
    
end

write memory
