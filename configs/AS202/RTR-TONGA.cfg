
enable
configure terminal
hostname RTR-TONGA
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 ip address 10.202.224.2 255.255.255.252
 no shutdown
 exit

interface e0/1
 ip address 10.202.224.5 255.255.255.252
 no shutdown
 exit

interface e0/2
 ip address 10.203.202.2 255.255.255.252
 no shutdown
 exit

interface e0/3
 ip address 10.202.200.2 255.255.255.252
 no shutdown
 exit

interface e1/0
 ip address 10.202.201.2 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 202.202.0.0 255.255.255.255
 no shutdown
 exit

router bgp 202
 neighbor 10.202.201.1 remote-as 201
 neighbor 10.203.202.1 remote-as 203
 neighbor 10.202.200.1 remote-as 200
 neighbor 10.202.224.1 remote-as 224
 neighbor 10.202.224.6 remote-as 224
 
 network 202.202.0.0 mask 255.255.255.255

end
write memory
