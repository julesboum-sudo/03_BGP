
enable
configure terminal
hostname RTR-OBALA
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 description RTR-OBALA_INTERCO_RTR-OMBESSA
 ip address 172.17.17.22 255.255.255.252
 no shutdown
 exit

interface e0/1
 description RTR-OBALA_INTERCO_RTR-BOKITO
 ip address 172.17.17.30 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 100.10.1.1 255.255.255.255
 no shutdown
 exit


router bgp 224
 neighbor 172.17.17.29 remote-as 224
 neighbor 172.17.17.21 remote-as 224

 network 100.10.1.1 mask 255.255.255.255
 exit

router ospf 1
    network 172.17.17.28 0.0.0.3 area 0
    network 172.17.17.20 0.0.0.3 area 0

end

write memory
