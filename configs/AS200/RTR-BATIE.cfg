
enable
configure terminal
hostname RTR-BATIE
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 ip address 10.200.201.1 255.255.255.252
 no shutdown
 exit

interface e0/1
 ip address 10.202.200.1 255.255.255.252
 no shutdown
 exit

interface e0/2
 ip address 10.203.200.1 255.255.255.252
 no shutdown
 exit

interface e0/3
 ip address 10.200.121.1 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 200.200.0.0 255.255.255.255
 no shutdown
 exit

router bgp 200
 neighbor 10.200.121.2 remote-as 121
 neighbor 10.203.200.2 remote-as 203
 neighbor 10.203.200.2 transport connection-mode active

 neighbor 10.202.200.2 remote-as 202
 neighbor 10.200.201.2 remote-as 201 
 network 200.200.0.0 mask 255.255.255.255

end
write memory
