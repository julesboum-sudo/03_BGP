
enable
configure terminal
hostname RTR-KINO
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 description RTR-KIIKI_INTERCO_RTR-OMBESSA
 ip address 172.17.17.6 255.255.255.252
 no shutdown
 exit

interface e0/1
 description RTR-KINO_INTERCO_RTR-BAFIA
 ip address 172.17.17.2 255.255.255.252
 no shutdown
 exit

interface e0/2
 description RTR-KINO_INTERCO_RTR-BOKITO
 ip address 172.17.17.13 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 70.0.0.0 255.255.255.255
 no shutdown
 exit

router bgp 224
    neighbor 172.17.17.1 remote-as 224
    neighbor 172.17.17.5 remote-as 224
    neighbor 172.17.17.14 remote-as 224

    network 70.0.0.0 mask 255.255.255.255

     exit

router ospf 1
    network 172.17.17.0 0.0.0.3 area 0
    network 172.17.17.4 0.0.0.3 area 0
    network 172.17.17.12 0.0.0.3 area 0
    
end
write memory
