
enable
configure terminal
hostname RTR-BAFANG
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 ip address 10.201.121.1 255.255.255.252
 no shutdown
 exit

interface e0/1
 ip address 10.121.121.1 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 200.121.121.1 255.255.255.255
 no shutdown
 exit

router bgp 121
 neighbor 10.121.121.2 remote-as 121
 neighbor 10.201.121.2 remote-as 201
 network 200.121.121.1 mask 255.255.255.255

end

write memory
