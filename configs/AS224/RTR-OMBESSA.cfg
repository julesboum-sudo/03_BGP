
enable
configure terminal
hostname RTR-OMBESSA
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 description RTR-OMBESSA_INTERCO_RTR-BOKITO
 ip address 172.17.17.17 255.255.255.252
 no shutdown
 exit

interface e0/1
 description RTR-OMBESSA_INTERCO_RTR-OBALA
 ip address 172.17.17.21 255.255.255.252
 no shutdown
 exit

interface e0/2
 description RTR-OMBESSA_INTERCO_RTR-KIIKI
 ip address 172.17.17.5 255.255.255.252
 no shutdown
 exit

interface e0/3
 description RTR-OMBESSA_INTERCO_RTR-NKOMETOU
 ip address 172.17.17.33 255.255.255.252
 no shutdown
 exit

interface e1/0
 description RTR-OMBESSA_AS224_INTERCO_RTR-MAKENENE_AS201
 ip address 10.201.224.1 255.255.255.252
 no shutdown
 exit

interface e1/1
 description RTR-OMBESSA_AS224_INTERCO_RTR-TONGA_AS202
 ip address 10.202.224.6 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 100.100.2.3 255.255.255.255
 no shutdown
 exit

router bgp 224
 neighbor 10.201.224.2 remote-as 201
 neighbor 10.202.224.5 remote-as 202

 neighbor 172.17.17.34 remote-as 224
 neighbor 172.17.17.22 remote-as 224
 neighbor 172.17.17.18 remote-as 224
 neighbor 172.17.17.6 remote-as 224

 network 100.100.2.3 mask 255.255.255.255
     exit

router ospf 1
    network 172.17.17.32 0.0.0.3 area 0
    network 172.17.17.20 0.0.0.3 area 0
    network 172.17.17.16 0.0.0.3 area 0
    network 172.17.17.4 0.0.0.3 area 0
    
    default-information originate always
end
write memory
