
enable
configure terminal
hostname RTR-NKOMETOU
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
no ip domain lookup

interface e0/0
 description RTR-NKOMETOU_INTERCO_RTR-BOKITO
 ip address 172.17.17.26 255.255.255.252
 no shutdown
 exit

interface e0/1
 description RTR-NKOMETOU_INTERCO_RTR-OMBESSA
 ip address 172.17.17.34 255.255.255.252
 no shutdown
 exit

interface loopback0
 description RL
 ip address 100.20.2.2 255.255.255.255
 no shutdown
 exit

router bgp 224
 neighbor 172.17.17.33 remote-as 224
 neighbor 172.17.17.25 remote-as 224

 network 100.20.2.2 mask 255.255.255.255
exit

router ospf 1
    network 172.17.17.32 0.0.0.3 area 0
    network 172.17.17.24 0.0.0.3 area 0

end
write memory
